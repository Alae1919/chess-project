# Production stack. Secrets come from a .env file next to this one (git-ignored):
#   cp .env.example .env   and fill in real values.
# Only the frontend is published; nginx reaches the backend and the database
# over the internal Docker network.

services:
  db:
    image: postgres:15
    container_name: chess_db
    environment:
      POSTGRES_DB: chess_db
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./chess-engine
      dockerfile: Dockerfile
    container_name: chess_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/chess_db
      - SPRING_DATASOURCE_USERNAME=chess_user
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env (the site origin, e.g. https://chess.example.com)}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
