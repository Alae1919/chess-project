# Alert rules, in Prometheus rule-file format. Grafana Cloud imports this file
# (Alerts & IRM → Alert rules → Import to Grafana-managed rules, or mimirtool rules load).
# The thresholds follow the targets in docs/performance.md. See docs/monitoring.md.
groups:
  - name: rexchess-latency
    rules:
      - alert: MoveSlow
        # p95 of the player's move, server side
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri="/api/games/{gameId}/moves", method="POST"}[10m]))) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Moves take more than 300 ms at p95 on the server"
          description: "Check chess_move_persist (the database), Hikari pending connections, and host CPU steal."

      - alert: AiReplySlow
        # levels 1-5 search a fixed number of nodes: they should not take long, whatever the box
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(chess_ai_search_seconds_bucket{level=~"[1-5]", source="search"}[15m]))) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "AI searches for levels 1-5 take more than 500 ms at p95"
          description: "Usually CPU: several level-6 games at once, or the t3 instance out of CPU credits (node_cpu steal)."

      - alert: LcpSlow
        expr: |
          histogram_quantile(0.75, sum by (le) (rate(rum_vital_milliseconds_bucket{name="LCP"}[1h]))) > 2500
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Largest Contentful Paint is over 2.5 s for a quarter of page views"

      - alert: CspViolations
        # the browser refused something the page asked for: a feature broken in production only (ng serve sends no
        # CSP). The desk's props once lost their colours this way, with nothing in any log
        expr: |
          sum(increase(rum_timing_milliseconds_count{name="csp.violation"}[1h])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Browsers refused something under the Content-Security-Policy in the last hour"
          description: "The dashboard's 'Refused by the CSP' panel names the rule; compare frontend/nginx-snippets/security-headers.conf with what the page loads."

      - alert: ServerErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 1% of API requests fail with a 5xx"

      - alert: DatabasePoolWaiting
        expr: max(hikaricp_connections_pending) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Requests are queueing for a database connection"

  - name: rexchess-host
    rules:
      - alert: HostMemoryLow
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The server has less than 10% of its memory free"

      - alert: HostCpuStolen
        # a t3 instance out of CPU credits is throttled: everything slows down, the AI first
        expr: avg(rate(node_cpu_seconds_total{mode="steal"}[10m])) > 0.2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 20% of CPU time is stolen: the instance is probably out of CPU credits"

      - alert: DiskFilling
        expr: |
          1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} > 0.85
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The server's disk is more than 85% full"

      - alert: MetricsMissing
        # Alloy stopped, or the backend is down: either way nothing above can fire
        expr: absent(up{job=~".*backend.*"} == 1)
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No metrics from the backend for 10 minutes"
