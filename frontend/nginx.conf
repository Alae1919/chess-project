# Serves the Angular build and proxies /api and /ws to the backend.
# In production a TLS proxy (Caddy, see ../Caddyfile) sits in front of this server.

# Behind that proxy the TCP peer is the proxy itself. Take the visitor's address from
# X-Forwarded-For, but only when the peer is on a private network (the Docker network):
# a client reaching us directly cannot forge it, and the backend's per-address rate limit
# then counts visitors instead of counting the proxy as one very busy visitor.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# A coarse flood guard in front of the backend's own, precise login/registration limit
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

# The piece models (assets/models/*.glb). nginx's stock mime.types does not know .glb, so they would go
# out as application/octet-stream, which gzip below would skip. This adds to the stock list: it is the
# same (http) context as the include of mime.types. Inside `server` it would replace the whole list.
types {
    model/gltf-binary glb;
}

# The default format logs the whole request line, and the WebSockets carry the login token in
# the URL (?token=...). $uri is the path without the query string.
# rt: the whole request, in seconds; urt: the backend's part of it ("-" for static files);
# rid: the id the backend logs too (see proxy.conf)
log_format app '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                'rt=$request_time urt=$upstream_response_time rid=$request_id';

# The container healthcheck (busybox wget, every 10 s) would be most of the log
map $http_user_agent $loggable {
    ~^Wget  0;
    default 1;
}

# Browser timings (see /api/rum below): a page sends a handful a minute
limit_req_zone $binary_remote_addr zone=rum:10m rate=30r/m;

# The backend. Connections to it are kept open and reused (keepalive), rather than one new
# connection per API call. `resolve` asks Docker's DNS again every 10 s: with a fixed address,
# nginx would keep the one from startup, and every API call would fail with 502 after the
# backend container is recreated (any `docker compose up --build`).
upstream backend {
    zone backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
    keepalive 16;
}

# Files under /assets are named the same from one deploy to the next. The app asks for them with
# their content hash in the query (assetUrl(), ?v=...): that URL can never change, so browsers
# keep it for a year. Without one (the manifest's icons, say), they check every time.
map $arg_v $asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log app if=$loggable;

    root /usr/share/nginx/html;
    index index.html;

    # The build writes a .gz of every text file and model next to it, at the highest level
    # (scripts/precompress.mjs): send that rather than compressing the file again on every request
    gzip_static on;
    # what has no .gz (small files, anything added by hand) is compressed on the fly.
    # JSON is left to Caddy, which compresses the API's answers with zstd or gzip.
    gzip on;
    gzip_vary on;
    # Caddy's requests carry a Via header, which makes nginx treat them as proxied,
    # and it does not compress those unless told to
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # the models are uncompressed meshes: about 180 kB each, 100 kB gzipped
    gzip_types text/css application/javascript text/javascript image/svg+xml model/gltf-binary;

    # The app: static files, falling back to index.html for Angular's routes.
    # Revalidated on every load, so a new deploy shows up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets: a missing file is a 404, never index.html (see the map above for their caching)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $asset_cache_control always;
        try_files $uri =404;
    }

    # Bundles carry a content hash in their name, and so do the images the stylesheets use
    # (media/), so a given name never changes: cache for a year. A name that no longer exists
    # is a 404, never index.html served as JavaScript.
    location ~ ^/(?:(?:main|polyfills|chunk|styles)-[A-Za-z0-9]+\.(?:js|css)|media/.+)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Login, registration, token refresh
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";   # keep the connection to the backend open
        proxy_pass http://backend;
    }

    # Page-load and move timings from the browsers, sent without a login
    location = /api/rum {
        limit_req zone=rum burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";   # keep the connection to the backend open
        proxy_pass http://backend;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Connection "";   # keep the connection to the backend open
        proxy_pass http://backend;
    }

    # Game and lobby WebSockets
    location /ws {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # nginx closes a connection that carries nothing for 60 s, and a game or lobby socket is
        # quiet while a player thinks. The backend pings every 25 s; this is the safety margin.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://backend;
    }
}
