# Serves the Angular build and proxies /api and /ws to the backend.
# In production a TLS proxy (Caddy, see ../Caddyfile) sits in front of this server.

# Behind that proxy the TCP peer is the proxy itself. Take the visitor's address from
# X-Forwarded-For, but only when the peer is on a private network (the Docker network):
# a client reaching us directly cannot forge it, and the backend's per-address rate limit
# then counts visitors instead of counting the proxy as one very busy visitor.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# A coarse flood guard in front of the backend's own, precise login/registration limit
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

# The default format logs the whole request line, and the WebSockets carry the login token in
# the URL (?token=...). $uri is the path without the query string.
log_format app '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log app;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's resolver, asked again every 10 s. With a plain `proxy_pass http://backend`
    # nginx would keep the backend's address from startup, and every API call would fail
    # with 502 after the backend container is recreated (any `docker compose up --build`).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8080;

    gzip on;
    gzip_vary on;
    # Caddy's requests carry a Via header, which makes nginx treat them as proxied,
    # and it does not compress those unless told to
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # The app: static files, falling back to index.html for Angular's routes.
    # Revalidated on every load, so a new deploy shows up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Bundles carry a content hash in their name, so a given name never changes: cache for
    # a year. A name that no longer exists is a 404, never index.html served as JavaScript.
    location ~ ^/(?:main|polyfills|chunk|styles)-[A-Za-z0-9]+\.(?:js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Login, registration, token refresh
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$backend;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$backend;
    }

    # Game and lobby WebSockets
    location /ws {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # nginx closes a connection that carries nothing for 60 s, and a game or lobby socket is
        # quiet while a player thinks. The backend pings every 25 s; this is the safety margin.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://$backend;
    }
}
