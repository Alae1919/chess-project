# Shared by the /api and /ws locations. $remote_addr is already the visitor's address
# (see set_real_ip_from in nginx.conf), so it replaces the header instead of extending it:
# whatever a client wrote in X-Forwarded-For never reaches the backend.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
