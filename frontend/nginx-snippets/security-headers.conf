# Headers for the pages and scripts nginx serves itself. (The API's responses get theirs
# from Spring Security.) `always` so they are also sent on error pages.
#
# nginx only inherits add_header from an enclosing block when the location has none of its
# own, so every location that serves files includes this file.
#
# Content-Security-Policy:
#   script-src 'self'   no inline scripts, no third-party scripts: the main defence against XSS
#   style-src           Angular injects component styles inline, so 'unsafe-inline' is needed
#   font-src / style    the Google Fonts the app uses
#   connect-src         the API (same origin) and the game WebSockets
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
