
spring:
  application:
    name: chess-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/chess_db
    username: chess_user
    password: chess_pass
    hikari:
      maximum-pool-size: 10

  jpa:
    # Off: a request must not hold a database connection while it does other work (an AI
    # search can take seconds). Code that reads lazy collections opens its own transaction.
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  task:
    scheduling:
      pool:
        size: 4                 # the clock watcher, matchmaking and countdowns must not queue behind each other

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  # Required: no default on purpose. Set JWT_SECRET to at least 32 random bytes,
  # e.g. `openssl rand -base64 48`. JwtService refuses to start without it.
  secret: ${JWT_SECRET:}
  access-token-expiry-ms: 900000        # 15 minutes
  refresh-token-expiry-ms: 604800000    # 7 days

app:
  # Browser origins allowed to call the API and open WebSockets (comma-separated,
  # Spring origin patterns). In production set ALLOWED_ORIGINS to the site's own
  # origin, e.g. https://chess.example.com: behind the proxy it counts as cross-origin.
  # How long a player can stay disconnected from an online game before they lose it
  abandon-timeout-seconds: 60
  # An online game is called off, unrated, if a side takes longer than this to make its first move
  first-move-timeout-seconds: 30
  rate-limit:
    # Login and registration attempts allowed per address per minute (counted separately)
    auth-per-minute: 20
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

management:
  endpoints:
    web:
      exposure:
        include: health         # nothing else: no env, beans or heap dumps
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.chess: DEBUG
    org.hibernate.SQL: DEBUG
