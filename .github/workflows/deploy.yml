name: Deploy

# Runs after CI has passed on main, and can be started by hand from the Actions tab.
# GitHub proves its identity to AWS with OIDC (no stored keys) and asks AWS Systems Manager
# to run the update on the instance: no SSH, no open port 22. See docs/DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Two deploys at once would fight over the same docker build: queue them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # lets the job request the OIDC token AWS checks

jobs:
  deploy:
    name: Deploy to EC2
    # a manual run always goes; an automatic one only when CI succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # The commit CI tested (not whatever main points at by now), fast-forward only so a
      # server that drifted from main fails loudly instead of being overwritten.
      # --wait returns once every service is healthy and fails otherwise.
      - name: Update and restart
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          script=$(cat <<EOS
          set -euo pipefail
          cd /home/ubuntu/chess-project
          git fetch --quiet origin main
          git merge --ff-only $SHA
          docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f > /dev/null
          EOS
          )
          # SSM runs commands as root; the checkout and docker belong to ubuntu
          params=$(jq -n --arg s "$script" '{commands: ["sudo -u ubuntu -H bash -c " + ($s | @sh)]}')

          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA" \
            --timeout-seconds 1200 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"

          status=Pending
          while [[ $status == Pending || $status == InProgress || $status == Delayed ]]; do
            sleep 10
            # the invocation does not exist for a moment right after send-command
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Final status: $status"
          [[ $status == Success ]]
