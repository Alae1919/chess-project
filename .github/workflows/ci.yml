name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17 + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-engine

    # The Spring tests boot the real app and run Flyway, so they need a database.
    # These are the credentials application.yml already defaults to.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chess_db
          POSTGRES_USER: chess_user
          POSTGRES_PASSWORD: chess_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess_user -d chess_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: chess-engine/target/surefire-reports

  frontend:
    name: Frontend (Angular tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Unit specs in headless Chrome (preinstalled on ubuntu-latest)
      - name: Test
        run: npm run test:ci

      # The production build type-checks the templates, which the specs don't cover.
      # It also fails past the initial-bundle budget in angular.json.
      - name: Build
        run: npm run build -- --configuration production

      # Every other file of the build: the lazy chunks (three.js), models, pictures, videos, fonts
      - name: Size budget
        run: npm run check:sizes

      # Page loads under Lighthouse (mobile, throttled), on / and /login. Warnings only for now:
      # the numbers on a shared CI machine vary too much to fail a build on. Reports are kept.
      - name: Lighthouse
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          if-no-files-found: ignore
