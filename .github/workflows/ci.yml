name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17 + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-engine

    # The Spring tests boot the real app and run Flyway, so they need a database.
    # These are the credentials application.yml already defaults to.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chess_db
          POSTGRES_USER: chess_user
          POSTGRES_PASSWORD: chess_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess_user -d chess_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: chess-engine/target/surefire-reports

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # No spec files yet, so the production build (type-check + template check) is the gate.
      - name: Build
        run: npm run build -- --configuration production
